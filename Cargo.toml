[package]
name = "ordain"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Review coding-agent edits against repository instructions"
readme = "README.md"
keywords = ["code-review", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.48", features = ["derive"] }
globset = "0.4.16"
hex = "0.4.3"
libc = "0.2.176"
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha1 = "0.10.6"
sha2 = "0.10.9"
similar = "2.7.0"
thiserror = "2.0.16"
tempfile = "3.23.0"
walkdir = "2.5.0"
toml = "0.9"
xdg = "3"
diffy = "0.4"
toml_edit = "0.23"
serde_yaml_ng = "0.10"
shlex = "1"

[dev-dependencies]
tiny_http = "0.12.0"
wait-timeout = "0.2.1"

[profile.release]
strip = true
lto = "thin"
